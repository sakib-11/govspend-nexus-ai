version: '3.8'

services:
  explanation-validator-svc:
    build:
      context: ../../services/explanation-validator-svc
      dockerfile: Dockerfile
    container_name: explanation-validator-svc
    restart: unless-stopped
    ports:
      - "8018:8018"
    environment:
      - VALIDATOR_ENVIRONMENT=production
      - VALIDATOR_DB_HOST=postgres
      - VALIDATOR_DB_PORT=5432
      - VALIDATOR_DB_NAME=govspend
      - VALIDATOR_DB_USER=govspend
      - VALIDATOR_DB_PASSWORD=${DB_PASSWORD}
      - VALIDATOR_REDIS_HOST=redis
      - VALIDATOR_REDIS_PORT=6379
      - VALIDATOR_REDIS_PASSWORD=${REDIS_PASSWORD}
      - VALIDATOR_GROQ_API_KEY=${GROQ_API_KEY}
      - VALIDATOR_JWT_SECRET=${JWT_SECRET}
      - VALIDATOR_HMAC_KEY=${LEDGER_ENC_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - govspend-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8018/health/detailed"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  explanation-svc:
    build:
      context: ../../services/explanation-svc
      dockerfile: Dockerfile
    container_name: explanation-svc
    restart: unless-stopped
    ports:
      - "8017:8017"
    environment:
      - EXPLANATION_ENVIRONMENT=production
      - EXPLANATION_DB_HOST=postgres
      - EXPLANATION_DB_PORT=5432
      - EXPLANATION_DB_NAME=govspend_explanations
      - EXPLANATION_DB_USER=govspend
      - EXPLANATION_DB_PASSWORD=${DB_PASSWORD}
      - EXPLANATION_REDIS_HOST=redis
      - EXPLANATION_REDIS_PORT=6379
      - EXPLANATION_REDIS_PASSWORD=${REDIS_PASSWORD}
      - EXPLANATION_GROQ_API_KEY=${GROQ_API_KEY}
      - EXPLANATION_OPENAI_API_KEY=${OPENAI_API_KEY}
      - EXPLANATION_JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - govspend-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8017/health/detailed"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: govspend-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=govspend
      - POSTGRES_USER=govspend
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - govspend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govspend -d govspend"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: govspend-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - govspend-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  nginx:
    image: nginx:alpine
    container_name: govspend-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - explanation-validator-svc
      - explanation-svc
    networks:
      - govspend-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  govspend-network:
    driver: bridge