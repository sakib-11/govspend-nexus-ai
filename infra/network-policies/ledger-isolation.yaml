apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ledger-deny-all
  namespace: govspend-ledger
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ledger-allow-unmask
  namespace: govspend-ledger
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: govspend-unmask
    ports:
    - protocol: TCP
      port: 5432
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: govspend-unmask
    ports:
    - protocol: TCP
      port: 5432

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-allow-mcp
  namespace: govspend-gateway
spec:
  podSelector:
    matchLabels:
      app: mcp-gateway
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: govspend-frontend
    - namespaceSelector:
        matchLabels:
          name: govspend-explanation
    ports:
    - protocol: TCP
      port: 8004
